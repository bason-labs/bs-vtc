# Release pipeline (spine AD-26; owner: cli+binary team; docs: packaging/README.md).
#
# Does nothing until the repository has a GitHub remote. A `v*` tag verifies, cross-compiles,
# smoke-tests on native runners, packages, checksums, attests and publishes a draft-first
# release; a manual run (workflow_dispatch) is a dry run that stops before publishing.
#
# Supply chain: every action is pinned to a full commit SHA (the tag is in the comment); the
# workflow token is read-only except in the publish job; no cache is restored into a release
# build; checkouts keep no credentials; there is no pull_request_target trigger.
#
# TODO(H-2): sign + notarize once the owner has an Apple Developer ID. Until then the
# sign-macos job is skipped and the macOS binaries ship unsigned, with SHA-256 checksums.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: version
        name: The tag equals the source version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' packages/cli/src/version.ts)"
          if [ -z "$version" ]; then
            echo "::error::no VERSION in packages/cli/src/version.ts"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match VERSION $version in packages/cli/src/version.ts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: cross-compile
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compile one binary per target
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""
            if [ "$target" = windows-x64 ]; then ext=".exe"; fi
            (cd packages/cli && bun scripts/build-binary.ts --target "bun-$target" --outfile "$GITHUB_WORKSPACE/build/$target/vtc$ext")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: build/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke ${{ matrix.target }}
    needs: [verify, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: build
      - name: vtc --version and the MCP bridge outside a repository
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ext=""
          if [ "$TARGET" = windows-x64 ]; then ext=".exe"; fi
          bin="$GITHUB_WORKSPACE/build/$TARGET/vtc$ext"
          chmod +x "$bin"
          export VTC_HOME="$RUNNER_TEMP/vtc-home"
          mkdir -p "$RUNNER_TEMP/not-a-repo"
          cd "$RUNNER_TEMP/not-a-repo"
          "$bin" --version | tee version.txt
          grep -q "^vtc $VERSION " version.txt
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            | "$bin" engine --mcp --host claude-code | tee mcp.txt
          grep -q '"serverInfo":{"name":"vtc"' mcp.txt

  sign-macos:
    name: sign + notarize macOS (pending H-2)
    needs: smoke
    # TODO(H-2): sign + notarize once the owner has an Apple Developer ID. Switch this on then
    # (and check packaging/macos/entitlements.plist, JIT keys only, under test). Until then it never runs and the
    # release ships unsigned binaries. A bare Mach-O binary cannot be stapled; Gatekeeper checks
    # the notarization online on first run. The steps below are a placeholder: before switching
    # it on, add the temporary-keychain certificate import and `notarytool store-credentials`
    # steps described in packaging/README.md, or codesign and --keychain-profile have nothing.
    if: ${{ false }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: build
      - name: Sign, then notarize
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          for target in darwin-arm64 darwin-x64; do
            codesign --force --options runtime --timestamp \
              --entitlements packaging/macos/entitlements.plist \
              --sign "$SIGNING_IDENTITY" "build/$target/vtc"
            ditto -c -k --keepParent "build/$target/vtc" "$RUNNER_TEMP/vtc-$target.zip"
            xcrun notarytool submit "$RUNNER_TEMP/vtc-$target.zip" --keychain-profile "$NOTARY_PROFILE" --wait
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-signed
          path: |
            build/darwin-arm64/
            build/darwin-x64/
          if-no-files-found: error
          retention-days: 7

  package:
    name: package and checksum
    needs: [verify, smoke, sign-macos]
    # The signing job is skipped until H-2; packaging runs after it either way. Signing comes
    # before the checksums (AD-26 rule 3).
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.smoke.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: build
      - if: ${{ needs.sign-macos.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-signed
          path: build
      - name: Archives, SHA256SUMS, formula and installer
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            chmod 0755 "build/$target/vtc"
            tar -C "build/$target" -czf "release/vtc-$VERSION-$target.tar.gz" vtc
          done
          (cd build/windows-x64 && zip -q -X "$GITHUB_WORKSPACE/release/vtc-$VERSION-windows-x64.zip" vtc.exe)
          bun packages/cli/scripts/release-checksums.ts release
          bun packages/cli/scripts/release-render.ts --version "$VERSION" --repo "$REPO" --sums release/SHA256SUMS --out release
          bun packages/cli/scripts/release-checksums.ts release
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and publish
    needs: [verify, package]
    # Tags only: a workflow_dispatch run is a dry run and ends with the release artifact.
    # The explicit status check matters: sign-macos is skipped until H-2, and without one GitHub
    # adds an implicit success() that carries that skip down the needs chain and skips this job.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.package.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/*
      - name: Draft, upload, then publish (immutable once published)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Verify a download: sha256sum -c SHA256SUMS --ignore-missing"
            echo "Verify its provenance: gh attestation verify <file> -R $GH_REPO"
            echo
            echo "The macOS binaries are not signed or notarized yet (pending the owner's Apple Developer ID)."
            echo
            echo 'Upgrading from an earlier vtc: in each repo where you use VTC with Claude Code, re-run `vtc install --host claude-code`, so its settings carry the session sandbox rules of this release.'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --verify-tag --title "vtc $TAG" --notes-file "$RUNNER_TEMP/notes.md" release/*
          gh release edit "$TAG" --draft=false
