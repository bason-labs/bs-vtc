id: lens_auth
version: 1.0.0
kind: lens
mission: >-
  Review a task's diff that touches authentication, sessions, tokens, recovery, permissions or tenant isolation, against the identity and access lens checklist.
inputs: [task, diff, gate_report, threat_model]
output: { artifacts: [], verdicts: [pass, fail, unknown] }
exits: [done]
success_criteria:
  - id: claim_check
    description: "Every finding cites a changed line that exists."
reviewer: engine
models:
  claude-code: { tier: mid, effort: high }
  codex: { tier: mid, effort: high }
tools: { profile: read_only }
budget: { context_tokens: 30000 }
