id: lens_secrets
version: 1.0.0
kind: lens
mission: >-
  Describe a committed or exposed secret precisely enough for the human escalation, and check the task's secret handling against the secrets lens checklist.
inputs: [task, diff, gate_report, findings]
output: { artifacts: [], verdicts: [pass, fail, unknown] }
exits: [done]
success_criteria:
  - { id: claim_check, description: "Every finding cites a changed line that exists." }
reviewer: engine
models:
  claude-code: { tier: mid, effort: high }
  codex: { tier: mid, effort: high }
tools: { profile: read_only }
budget: { context_tokens: 30000 }
