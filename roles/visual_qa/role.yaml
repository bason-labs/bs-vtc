# New: criteria V1-V8 with question types, "unreached is not clean", never measure pixels.
id: visual_qa
version: 1.0.0
kind: core
mission: >-
  Judge the rendered UI of a task or feature against the approved design on criteria V1 to V8,
  after the deterministic visual checks, citing screenshots and elements.
inputs: [task, screens, design_tokens, design_md, screenshots, visual_report, diff]
output: { artifacts: [], verdicts: [pass, fail, unknown, unchecked] }
exits: [done]
success_criteria:
  - { id: claim_check, description: "Every verdict cites a screenshot or element that exists." }
reviewer: engine
models:
  claude-code: { tier: mid, effort: medium }
  codex: { tier: mid, effort: medium }
tools: { profile: read_only }
budget: { context_tokens: 40000 }
