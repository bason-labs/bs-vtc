# Forked from msitarzewski/agency-agents (MIT, see roles/NOTICE) at f99f6aa. An engineer
# profile (§5.2a): it compiles on top of roles/engineer, which holds the shared contract.
#   engineering/engineering-frontend-developer.md (Core Web Vitals and WCAG rules only; its
#     pasted editor-integration mission and FID were dropped, INP replaces FID)
#   design/design-ui-finish-gate-reviewer.md (states and responsive priority are part of done)
#   testing/testing-accessibility-auditor.md (keyboard, focus and name checks)
id: engineer_frontend
version: 1.0.0
kind: engineer_profile
discipline: frontend
mission: >-
  Implement one frontend task: components, state, routing, forms, accessibility and performance, built only from the design system's tokens and components.
inputs:
  [
    task,
    spec,
    architecture,
    repo_map_slice,
    interface_contract,
    acceptance_test,
    findings,
    design_md,
    component_manifest,
    screens,
    design_tokens,
    prototype,
  ]
output: { artifacts: [interface_contract], verdicts: [] }
exits: [built, spec_conflict, blocked, out_of_scope_fault]
success_criteria:
  - {
      id: write_scope,
      description: "Every changed file is inside the task's files_scope; protected files are unchanged.",
    }
  - {
      id: gates_green,
      description: "Gates L0 to L5 and the discipline's gates pass on the submitted head.",
    }
reviewer: qa
models:
  claude-code: { tier: mid, effort: medium }
  codex: { tier: mid, effort: medium }
tools: { profile: code_sandboxed }
budget: { context_tokens: 80000 }
