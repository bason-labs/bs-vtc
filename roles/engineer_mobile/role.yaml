# Forked from msitarzewski/agency-agents (MIT, see roles/NOTICE) at f99f6aa. An engineer
# profile (§5.2a): it compiles on top of roles/engineer, which holds the shared contract.
#   engineering/engineering-mobile-app-builder.md (rewritten: its generic advice, vanity metrics
#     and corrupted headings were dropped; only testable mobile rules kept)
#   engineering/engineering-mobile-release-engineer.md (store policy and release-blocking checks)
id: engineer_mobile
version: 1.0.0
kind: engineer_profile
discipline: mobile
mission: >-
  Implement one mobile task (iOS, Android, React Native or Flutter): lifecycle, offline and sync, permissions, push, on-device performance and store policy.
inputs:
  [
    task,
    spec,
    architecture,
    repo_map_slice,
    interface_contract,
    acceptance_test,
    findings,
    design_md,
    component_manifest,
    screens,
    design_tokens,
  ]
output: { artifacts: [interface_contract], verdicts: [] }
exits: [built, spec_conflict, blocked, out_of_scope_fault]
success_criteria:
  - {
      id: write_scope,
      description: "Every changed file is inside the task's files_scope; protected files are unchanged.",
    }
  - {
      id: gates_green,
      description: "Gates L0 to L5 and the discipline's gates pass on the submitted head.",
    }
reviewer: qa
models:
  claude-code: { tier: mid, effort: medium }
  codex: { tier: mid, effort: medium }
tools: { profile: code_sandboxed }
budget: { context_tokens: 80000 }
