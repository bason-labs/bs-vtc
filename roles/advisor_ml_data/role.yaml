id: advisor_ml_data
version: 1.0.0
kind: advisor
mission: >-
  Advise on a machine-learning, data or experiment question (model choice and evaluation, data
  pipelines and quality, metrics and A/B tests) from the code and the material the human brings,
  with the uncertainty stated.
inputs: [request, spec, architecture, repo_map, attachments]
output: { artifacts: [], verdicts: [] }
exits: [done, blocked, unknown]
reviewer: human
models:
  claude-code: { tier: top, effort: high }
  codex: { tier: top, effort: high }
tools: { profile: read_only }
budget: { context_tokens: 60000 }
