# (§5.3): it compiles from roles/_shared/lens-reviewer.md, this prompt and skills/lens-infra.
#   engineering/engineering-devops-automator.md (rewritten), security-cloud-security-architect.md,
#   engineering/engineering-sre.md, support/support-infrastructure-maintainer.md
id: lens_infra
version: 1.0.0
kind: lens
mission: >-
  Review a task's diff that changes infrastructure as code, containers, CI/CD workflows or deploy configuration, against the infrastructure lens checklist.
inputs: [task, diff, gate_report, architecture, threat_model]
output: { artifacts: [], verdicts: [pass, fail, unknown] }
exits: [done]
success_criteria:
  - { id: claim_check, description: "Every finding cites a changed line that exists." }
reviewer: engine
models:
  claude-code: { tier: mid, effort: high }
  codex: { tier: mid, effort: high }
tools: { profile: read_only }
budget: { context_tokens: 30000 }
