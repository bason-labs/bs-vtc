# Forked from msitarzewski/agency-agents (MIT, see roles/NOTICE) at f99f6aa:
#   research/research-synthesist.md (base: the eight evidence rules, source grading, synthesis map)
#   product/product-trend-researcher.md (competitor taxonomy incl. DIY workarounds)
#   specialized/business-strategist.md ("what must be true", stress-test key assumptions)
#   testing/testing-tool-evaluator.md (weighted matrix for library or vendor choice)
# New: software-source evidence tiers, citations the engine resolves, untrusted-content rule;
# discovery with the host's own web search and page fetch (H-3, spine §5 reading 156); a
# locked-core edit, so MAJOR (D-bm, reading 167).
id: research_analyst
version: 3.0.0
kind: core
mission: >-
  Answer the research questions a new project or large feature raises with a brief in which every
  claim cites a source the engine can resolve, and gaps are stated rather than filled.
inputs: [request, repo_map]
output: { artifacts: [research_brief], verdicts: [] }
exits: [done, blocked]
success_criteria:
  - id: citations_resolve
    description: "Every claim cites a url or fact row the engine fetched."
reviewer: engine
models:
  claude-code: { tier: mid, effort: high }
  codex: { tier: mid, effort: high }
tools:
  profile: write_scoped
  write_paths: [".vtc/research/briefs/**"]
  engine_tools: [research_fetch, fact_lookup, fact_propose]
  host_web: true
budget: { context_tokens: 80000 }
