# (§5.3): it compiles from roles/_shared/lens-reviewer.md, this prompt and skills/lens-db.
#   engineering/engineering-database-reliability-engineer.md, engineering-database-optimizer.md,
#   engineering-ai-data-remediation-engineer.md
id: lens_db
version: 1.0.0
kind: lens
mission: >-
  Review a task's diff that changes a schema, a migration, a backfill or a bulk data operation, against the database lens checklist.
inputs: [task, diff, gate_report, architecture]
output: { artifacts: [], verdicts: [pass, fail, unknown] }
exits: [done]
success_criteria:
  - { id: claim_check, description: "Every finding cites a changed line that exists." }
reviewer: engine
models:
  claude-code: { tier: mid, effort: high }
  codex: { tier: mid, effort: high }
tools: { profile: read_only }
budget: { context_tokens: 30000 }
